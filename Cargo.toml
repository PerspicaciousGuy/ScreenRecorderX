[package]
name = "clearcast"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A hardware-accelerated screen recorder for Windows and Linux"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
fs2 = "0.4"
global-hotkey = "0.7"
gstreamer = { version = "0.24", features = ["v1_22"] }
gstreamer-video = { version = "0.24", features = ["v1_22"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.12", default-features = false, features = ["tokio"], optional = true }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net"] }
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["portal"]
portal = ["dep:ashpd"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[bin]]
name = "clearcast"
path = "src/main.rs"
