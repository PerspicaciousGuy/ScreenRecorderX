name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ffmpeg-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: media-cache
        with:
          path: dist/ffmpeg-windows
          key: windows-media-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/stage-gstreamer-sources.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 make
        if: steps.media-cache.outputs.cache-hit != 'true'
      - name: Build minimal Windows remuxer with source and licenses
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: CLEARCAST_FFMPEG_TARGET=windows scripts/build-ffmpeg.sh
      - name: Collect pinned GStreamer sources and build materials
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/stage-gstreamer-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: clearcast-ffmpeg-windows
          path: dist/ffmpeg-windows
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Native build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav ffmpeg xvfb xauth
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: xvfb-run -a cargo test --locked --test media_integration -- --ignored --test-threads=1
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: clearcast-linux-x64-unbundled
          path: target/release/clearcast
  windows:
    needs: ffmpeg-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GStreamer MSVC runtime and development files
        shell: pwsh
        run: |
          $base = 'https://gstreamer.freedesktop.org/data/pkg/windows/1.26.11/msvc'
          $packages = [ordered]@{
            'gstreamer-1.0-msvc-x86_64-1.26.11.msi' = '31cbc21fa0950b5c1e79c80959b2799805cb05a7a35953a13a9f790776137605'
            'gstreamer-1.0-devel-msvc-x86_64-1.26.11.msi' = 'af0a0720692052aaf5fb0cf2847ef34a87016ef0f914328d516f049e6c86f587'
          }
          foreach ($name in $packages.Keys) {
            Invoke-WebRequest "$base/$name" -OutFile "$env:RUNNER_TEMP\$name"
            if ((Get-FileHash "$env:RUNNER_TEMP\$name" -Algorithm SHA256).Hash.ToLower() -ne $packages[$name]) { throw "Checksum mismatch: $name" }
            $process = Start-Process msiexec.exe -ArgumentList @('/i', "$env:RUNNER_TEMP\$name", '/qn', '/norestart', 'ADDLOCAL=ALL') -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "GStreamer MSI failed: $($process.ExitCode)" }
          }
          choco install pkgconfiglite -y --no-progress
          $candidates = @([Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64', 'Machine'), 'C:\gstreamer\1.0\msvc_x86_64', 'C:\Program Files\gstreamer\1.0\msvc_x86_64')
          $gst = $candidates | Where-Object { $_ -and (Test-Path "$_\lib\pkgconfig\gstreamer-1.0.pc") } | Select-Object -First 1
          if (!$gst) { throw 'GStreamer SDK installation not found' }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gst" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$gst\lib\pkgconfig" >> $env:GITHUB_ENV
          "$gst\bin" >> $env:GITHUB_PATH
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --test config_and_recovery
      - run: cargo build --locked --release
      - uses: actions/download-artifact@v4
        with:
          name: clearcast-ffmpeg-windows
          path: dist/ffmpeg-windows
      - uses: actions/upload-artifact@v4
        with:
          name: clearcast-windows-x64-unbundled
          path: target/release/clearcast.exe
      - name: Build and test bundled Windows setup
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $env:Path = "${env:ProgramFiles(x86)}\NSIS;$env:Path"
          ./scripts/package-windows.ps1 -SkipBuild
          Compress-Archive -Path dist/windows/app/* -DestinationPath dist/Clearcast-0.1.0-windows-x64-portable.zip
      - name: Test installed payload in a path containing spaces
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'Clearcast install test'
          $setup = (Resolve-Path dist/Clearcast-0.1.0-windows-x64-setup.exe).Path
          $process = Start-Process -FilePath $setup -ArgumentList "/S /D=$install" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup failed: $($process.ExitCode)" }
          ./scripts/test-windows-package.ps1 -Stage $install
      - uses: actions/upload-artifact@v4
        with:
          name: clearcast-windows-x64-setup
          path: |
            dist/Clearcast-0.1.0-windows-x64-setup.exe
            dist/Clearcast-0.1.0-windows-x64-portable.zip
          if-no-files-found: error
